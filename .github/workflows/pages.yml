# Siteyi GitHub Pages'te yayınlar.
# Bu dala her push'ta çalışır; Pages kapalıysa kendisi açar.
name: Siteyi yayınla

on:
  push:
    branches: [claude/zara-birthday-website-o8mjzt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages'i hazırla (kapalıysa aç)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Yayınlanacak dosyaları ayıkla
        run: |
          mkdir -p _site
          cp index.html yonetim.html _site/
          cp -r css js assets _site/
          touch _site/.nojekyll
          # Alan adı yeniden çalışmaya başlayınca aşağıdaki satırı aç:
          # cp CNAME _site/
          ls -R _site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    needs: topla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - id: dagitim
        uses: actions/deploy-pages@v4
